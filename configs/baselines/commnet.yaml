# @package _global_

defaults:
  - /paths: ${oc.env:C3WM_PLATFORM,local}
  - /train/model@jepa: control_jepa
  - _self_

checkpoints:
  jepa: ???
cache: ???
data_dir: null
layouts: [0, 200]
actions: 3
labels: shortest_path

hindsight_prob: 0.5
max_goal_steps: 20
model:
  hidden_dim: 128
  comm_steps: 2
  skip: true
  share_weights: false
  drop_prob: 0.1
  latent_bits: 3
steps: 100000
batch_size: 256
lr: 1.0e-3
log_every: 1000
save_every: 10000
seed: 0
num_workers: 16
device: cuda
out_dir: ${paths.run}

pipeline:
  history_size: 3
  num_preds: 1
  embed_dim: 192
  img_size: 224
  msg_embedding_dim: 256
  num_embeddings: 256

wandb:
  enabled: true
  mode: online
  project: ${paths.phase}
  name: null

paths:
  phase: baselines

hydra:
  run:
    dir: ${paths.hydra}
