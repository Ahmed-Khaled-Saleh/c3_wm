# @package _global_

defaults:
  - /paths: ${oc.env:C3WM_PLATFORM,local}
  - /comm/env@env: findgoal
  - /train/model@jepa: control_jepa
  - _self_

checkpoints:
  jepa: ???
env_id: MultiGrid-FindGoal-15x15-v0
layouts: [0, 200]
actions: 3
num_envs: 1
obs_keys: [view_emb, goal_emb, direction, position]
episodes: 5000
mamba:
  goal_conditioned: false
  finish_value: 10.0
  near_coeff: 0.01
  progress: step

settings:
  DEVICE: cuda
  CAPACITY: 500000
log_every: 10
save_every: 250
seed: 0
device: cuda
out_dir: ${paths.run}

pipeline:
  history_size: 3
  num_preds: 1
  embed_dim: 192
  img_size: 224
  msg_embedding_dim: 256
  num_embeddings: 256

wandb:
  enabled: true
  mode: online
  project: ${paths.phase}
  name: null

paths:
  phase: baselines

hydra:
  run:
    dir: ${paths.hydra}
