# @package _global_

defaults:
  - /paths: ${oc.env:C3WM_PLATFORM,local}
  - /train/model@jepa: control_jepa
  - /train/model@vqvae: vqvae
  - _self_

checkpoints:
  jepa: ???
  vqvae: ???

data_dir: ${paths.datasets}/findgoal_layouts
val_layouts: [200, 260]
windows: 50000
seed: 0
batch_size: 256
num_workers: 16
device: cuda
out_dir: ${paths.run}

pipeline:
  history_size: 3
  num_preds: 1
  embed_dim: 192
  img_size: 224
  msg_embedding_dim: 256
  num_embeddings: 256

wandb:
  enabled: true
  project: phase-2-wm-finetune
  mode: online
  name: null

paths:
  phase: ${wandb.project}

hydra:
  run:
    dir: ${paths.hydra}
