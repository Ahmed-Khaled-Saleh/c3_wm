# @package _global_

defaults:
  - /paths: ${oc.env:C3WM_PLATFORM,local}
  - /train/model@jepa: control_jepa
  - /train/model@vqvae: vqvae
  - _self_

checkpoints:
  jepa: ???
  vqvae: ???

cache: null

data_dir: ${paths.datasets}/findgoal_layouts
val_layouts: [200, 260]
rollout_steps: 6
steps: 4000
batch_size: 128
lr: 1.0e-3
weight_decay: 1.0e-4
head:
  kind: goal_location
  hidden: 256
  absent: 12.0
val_windows: 4096
eval_every: 500
log_every: 50
seed: 0
num_workers: 16
device: cuda
out_dir: ${paths.run}

pipeline:
  history_size: 3
  num_preds: 1
  embed_dim: 192
  img_size: 224
  msg_embedding_dim: 256
  num_embeddings: 256

wandb:
  enabled: true
  project: phase-2-wm-finetune
  mode: online
  name: null

paths:
  phase: ${wandb.project}

hydra:
  run:
    dir: ${paths.hydra}
